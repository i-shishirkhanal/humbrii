<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humbri | Premium Booking Platform | Hotels, Resorts & Unique Stays</title>
    <meta name="description" content="Discover and book the best hotels, resorts, and unique accommodations. Verified properties, flexible booking options, and best price guarantee." />
    <meta name="keywords" content="hotels, resorts, accommodation, booking, luxury stays" />
    <link rel="canonical" href="https://humbri.com" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Humbri | Premium Booking Platform" />
    <meta property="og:description" content="Discover and book the best hotels, resorts, and unique stays." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Humbri | Premium Booking Platform" />
    <meta name="twitter:description" content="Discover and book the best hotels, resorts, and unique stays." />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Humbri",
      "url": "https://humbri.com",
      "description": "Premier platform for booking hotels, resorts, and unique accommodations",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://humbri.com/properties?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
